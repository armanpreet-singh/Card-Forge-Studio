name: Card Forge Security Tests

on:
  pull_request:
    paths:
      - "js/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/security-tests.yml"
  push:
    branches:
      - main

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check js/utils/sanitize.js
          node --check js/storage.js
          node --check js/templates/helpers.js
          node --check js/templates/templates.js

      - name: Run security regression tests
        run: npm test
